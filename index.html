<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="
        width=device-width, 
        initial-scale=1.0, 
        maximum-scale=1.0, 
        user-scalable=no
    ">
    <title>Listening Station</title>
    <style>
        /* Stops text highlighting */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0d1b;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: capitalize;
            letter-spacing: 1px;
        }

        p {
            color: #a2a8d3;
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 1.2rem;
            text-align: center;
        }

        /* 7-Button Flex Layout */
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            gap: 25px;
            max-width: 900px;
            width: 100%;
            padding: 10px;
        }

        /* Perfect Circle Buttons */
        .cosmic-btn {
            width: 180px;
            height: 180px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: 
                transform 0.1s ease, 
                filter 0.2s ease;
            box-shadow: inset 0 0 20px 
                rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Press effects */
        .cosmic-btn:active, 
        .cosmic-btn.playing {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* Glow ring when active */
        .cosmic-btn.playing::after {
            content: '';
            position: absolute;
            top: -8px; left: -8px;
            right: -8px; bottom: -8px;
            border: 4px solid #ffffff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.05); opacity: 0; }
        }

        /* Color Gradients */
        .color-1 { background: radial-gradient(circle, #ff416c, #ff4b2b); box-shadow: 0 0 20px rgba(255, 75, 43, 0.4); }
        .color-2 { background: radial-gradient(circle, #f7b733, #fc4a1a); box-shadow: 0 0 20px rgba(252, 74, 26, 0.4); }
        .color-3 { background: radial-gradient(circle, #00f2fe, #4facfe); box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); }
        .color-4 { background: radial-gradient(circle, #ffc0cb, #ffb8b8); box-shadow: 0 0 20px rgba(255, 192, 203, 0.4); }
        .color-5 { background: radial-gradient(circle, #ea8ffe, #9b51e0); box-shadow: 0 0 20px rgba(155, 81, 224, 0.4); }
        .color-6 { background: radial-gradient(circle, #fff200, #ffc400); box-shadow: 0 0 20px rgba(255, 242, 0, 0.4); }
        .color-7 { background: radial-gradient(circle, #00ff87, #60efff); box-shadow: 0 0 20px rgba(96, 239, 255, 0.4); }

        /* Fixed Inner Shape Bases to stop squashing */
        .space-shape {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. Spiral Galaxy */
        .galaxy-spiral {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 4px double rgba(255, 255, 255, 0.7);
            border-left-color: transparent;
            border-right-color: transparent;
            transform: rotate(45deg);
        }
        .galaxy-spiral::before {
            content: '';
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            box-shadow: 0 0 10px #ffffff;
        }

        /* 2. Saturn Planet */
        .ring-planet {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        .ring-planet::after {
            content: '';
            position: absolute;
            width: 110px; height: 20px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: rotate(-15deg);
        }

        /* 3. Orbit Path */
        .orbit-lines {
            width: 100px; height: 60px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: rotate(-20deg);
        }
        .orbit-lines::before {
            content: '';
            position: absolute;
            top: 15px; left: 25px;
            width: 50px; height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        .orbit-lines::after {
            content: '';
            position: absolute;
            top: 25px; left: 45px;
            width: 12px; height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
        }

        /* 4. Asteroid with Craters */
        .asteroid-rock {
            width: 75px; height: 75px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 40% 65% 45% 60% / 60% 45% 65% 40%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transform: rotate(25deg);
            position: relative;
        }
        .asteroid-rock::before {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            top: 20px; left: 25px;
            box-shadow: 
                15px 12px 0 -1px rgba(0,0,0,0.15),
                -5px 18px 0 1px rgba(0,0,0,0.15),
                12px -5px 0 0px rgba(0,0,0,0.15);
        }

        /* 5. Atom Nebula */
        .atom-nebula {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.7);
            transform: rotate(30deg);
        }
        .atom-nebula::before {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            background: #ffffff;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ffffff;
        }
        .atom-nebula::after {
            content: '';
            position: absolute;
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            top: -3px; left: -3px;
            transform: rotate(90deg) scaleX(0.3);
        }

        /* 6. Unique Glowing Space Sun for the Yellow Button */
        .cosmic-sun {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            /* Gives it a powerful, fuzzy solar heat blur */
            filter: blur(1.5px);
            position: relative;
        }
        
        /* This adds a massive radiant solar flare cloud behind the sun core */
        .cosmic-sun::after {
            content: '';
            position: absolute;
            top: -20px; left: -20px;
            right: -20px; bottom: -20px;
            background: #ffffff;
            border-radius: 50%;
            /* Deep space glow fog effect */
            filter: blur(12px);
            box-shadow: 0 0 30px 15px rgba(255, 255, 255, 0.9);
            z-index: -1;
            opacity: 0.85;
        }
        
        /* 7. Misty Hazy Star Burst */
        .nebula-bubble {
            width: 75px; height: 75px;
            position: relative;
            background: 
                radial-gradient(ellipse at center, #ffffff 0%, rgba(255,255,255,0.8) 20%, transparent 65%),
                radial-gradient(ellipse at center, #ffffff 0%, rgba(255,255,255,0.8) 20%, transparent 65%);
            background-size: 100% 15%, 15% 100%;
            background-position: center, center;
            background-repeat: no-repeat;
            filter: blur(1.5px);
        }
        .nebula-bubble::after {
            content: '';
            position: absolute;
            top: 10px; left: 10px;
            width: 55px; height: 55px;
            background: #ffffff;
            border-radius: 50%;
            filter: blur(8px);
            box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0.8);
            z-index: -1;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <h1>listening station</h1>
    <p>touch the shapes to hear the sounds of the universe</p>

    <!-- The 7 Perfectly Formatted Circles -->
    <div class="grid">
        <button class="cosmic-btn color-1" onclick="playSound(1)">
            <div class="space-shape galaxy-spiral"></div>
        </button>
        <button class="cosmic-btn color-2" onclick="playSound(2)">
            <div class="space-shape ring-planet"></div>
        </button>
        <button class="cosmic-btn color-3" onclick="playSound(3)">
            <div class="space-shape orbit-lines"></div>
        </button>
        <button class="cosmic-btn color-4" onclick="playSound(4)">
            <div class="space-shape asteroid-rock"></div>
        </button>
        <button class="cosmic-btn color-5" onclick="playSound(5)">
            <div class="space-shape atom-nebula"></div>
        </button>
        <button class="cosmic-btn color-6" onclick="playSound(6)">
            <div class="space-shape ring-planet" style="transform: scale(0.85) rotate(45deg);"></div>
        </button>
        <button class="cosmic-btn color-7" onclick="playSound(7)">
            <div class="space-shape nebula-bubble"></div>
        </button>
    </div>

    <!-- Hidden Audio Link Trackers -->
    <audio id="audio-1" src="sound1.mp3" preload="auto"></audio>
    <audio id="audio-2" src="sound2.mp3" preload="auto"></audio>
    <audio id="audio-3" src="sound3.mp3" preload="auto"></audio>
    <audio id="audio-4" src="sound4.mp3" preload="auto"></audio>
    <audio id="audio-5" src="sound5.mp3" preload="auto"></audio>
    <audio id="audio-6" src="sound6.mp3" preload="auto"></audio>
    <audio id="audio-7" src="sound7.mp3" preload="auto"></audio>

    <script>
        let currentAudio = null;
        let currentBtn = null;

        function playSound(id) {
            const btnList = document.querySelectorAll('.cosmic-btn');
            const clickedBtn = btnList[id - 1];
            const targetAudio = document.getElementById(`audio-${id}`);

            if (currentAudio === targetAudio) {
                targetAudio.pause();
                targetAudio.currentTime = 0;
                clickedBtn.classList.remove('playing');
                currentAudio = null;
                currentBtn = null;
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentBtn) {
                    currentBtn.classList.remove('playing');
                }
            }

            targetAudio.play().catch(function(e) {
                console.log("Audio issue encountered.");
            });

            clickedBtn.classList.add('playing');
            currentAudio = targetAudio;
            currentBtn = clickedBtn;

            targetAudio.onended = function() {
                clickedBtn.classList.remove('playing');
                if (currentAudio === targetAudio) {
                    currentAudio = null;
                    currentBtn = null;
                }
            };
        }
    </script>
</body>
</html>
