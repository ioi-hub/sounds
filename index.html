<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Sonification Station</title>
    <style>
        /* Stops kids from accidentally selecting text or highlighting buttons */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0d1b;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: #a2a8d3;
            text-shadow: 0 0 10px rgba(162, 168, 211, 0.3);
        }

        p {
            color: #6c729c;
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* Balanced 7-Button Layout with Flexbox for optimal iPad spacing */
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        /* Abstract Cosmic Base Button */
        .cosmic-btn {
            width: 140px;
            height: 140px;
            border: none;
            cursor: pointer;
            position: relative;
            background: none;
            transition: transform 0.1s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* Button Press Effect */
        .cosmic-btn:active, .cosmic-btn.playing {
            transform: scale(0.90);
            filter: brightness(1.3);
        }

        /* Glowing indicator ring when playing */
        .cosmic-btn.playing::after {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border: 4px dashed #ffffff;
            border-radius: 50%;
            animation: rotateGlow 8s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { transform: rotate(360deg); opacity: 0.8; }
        }

        /* --- 7 UNIQUE COSMIC SHAPES & BRAND COLORS --- */

        /* 1. Yellow Sun Sphere */
        .shape-yellow {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff77a, #f2c94c, #b8860b);
            box-shadow: 0 0 30px rgba(242, 201, 76, 0.6);
        }

        /* 2. Cyan Cosmic Capsule */
        .shape-cyan {
            width: 130px;
            height: 75px;
            border-radius: 25px;
            background: linear-gradient(135deg, #56ccf2, #2f80ed);
            box-shadow: 0 0 25px rgba(86, 204, 242, 0.5);
        }

        /* 3. Red Crimson Star Orb */
        .shape-red {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff8a7a, #eb5757, #8c1d1d);
            box-shadow: 0 0 30px rgba(235, 87, 87, 0.6);
        }

        /* 4. Emerald Shard (Vertical Pillar) */
        .shape-green {
            width: 75px;
            height: 130px;
            border-radius: 25px;
            background: linear-gradient(180deg, #6fcf97, #27ae60);
            box-shadow: 0 0 25px rgba(111, 207, 151, 0.5);
        }

        /* 5. Deep Purple Plasma Drop */
        .shape-purple {
            width: 80px;
            height: 130px;
            border-radius: 40px 40px 15px 15px;
            background: linear-gradient(180deg, #bb6bd9, #4a154b);
            box-shadow: 0 0 25px rgba(187, 107, 217, 0.5);
        }

        /* 6. Asteroid Grey (Irregular Geometric Fragment) */
        .shape-grey {
            width: 100px;
            height: 100px;
            border-radius: 35% 65% 55% 45% / 45% 40% 60% 55%;
            background: radial-gradient(circle at 30% 30%, #bdc3c7, #7f8c8d, #34495e);
            box-shadow: 0 0 20px rgba(127, 140, 141, 0.4);
        }

        /* 7. Orange Nebula Ribbon */
        .shape-orange {
            width: 140px;
            height: 70px;
            border-radius: 15px 40px 15px 40px;
            background: linear-gradient(135deg, #f2994a, #f2c94c);
            box-shadow: 0 0 25px rgba(242, 153, 74, 0.5);
        }

        /* --- THE CENTERPIECE: Beige Ring Satellite (Atmosphere Detail inside shapes) --- */
        .ring-overlay {
            position: absolute;
            width: 140px;
            height: 40px;
            border: 8px solid rgba(224, 219, 210, 0.7); /* Beige Brand Color */
            border-radius: 50%;
            transform: rotate(-15deg);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(224, 219, 210, 0.3);
        }

        .crater {
            position: absolute;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

    </style>
</head>
<body>

    <h1>Cosmic Listening Station</h1>
    <p>Tap a celestial shape to discover its hidden sound texture...</p>

    <!-- The 7 Mystery Space-Shape Buttons -->
    <div class="flex-container">
        <!-- 1. Yellow Sphere -->
        <button class="cosmic-btn" onclick="playSound(1)">
            <div class="shape-yellow"></div>
            <div class="crater" style="width:20px; height:20px; top:40px; left:40px;"></div>
        </button>

        <!-- 2. Cyan Capsule -->
        <button class="cosmic-btn" onclick="playSound(2)">
            <div class="shape-cyan"></div>
        </button>

        <!-- 3. Red Orb with Rings -->
        <button class="cosmic-btn" onclick="playSound(3)">
            <div class="shape-red"></div>
            <div class="ring-overlay"></div>
        </button>

        <!-- 4. Emerald Pillar -->
        <button class="cosmic-btn" onclick="playSound(4)">
            <div class="shape-green"></div>
        </button>

        <!-- 5. Purple Plasma Drop -->
        <button class="cosmic-btn" onclick="playSound(5)">
            <div class="shape-purple"></div>
        </button>

        <!-- 6. Grey Asteroid -->
        <button class="cosmic-btn" onclick="playSound(6)">
            <div class="shape-grey"></div>
            <div class="crater" style="width:15px; height:15px; top:35px; left:30px;"></div>
            <div class="crater" style="width:25px; height:22px; top:60px; left:55px;"></div>
        </button>

        <!-- 7. Orange Nebula Block -->
        <button class="cosmic-btn" onclick="playSound(7)">
            <div class="shape-orange"></div>
        </button>
    </div>

    <!-- Hidden Audio Elements pointing to your folder's 7 tracks -->
    <audio id="audio-1" src="sound1.mp3" preload="auto"></audio>
    <audio id="audio-2" src="sound2.mp3" preload="auto"></audio>
    <audio id="audio-3" src="sound3.mp3" preload="auto"></audio>
    <audio id="audio-4" src="sound4.mp3" preload="auto"></audio>
    <audio id="audio-5" src="sound5.mp3" preload="auto"></audio>
    <audio id="audio-6" src="sound6.mp3" preload="auto"></audio>
    <audio id="audio-7" src="sound7.mp3" preload="auto"></audio>

    <script>
        let currentAudio = null;
        let currentBtn = null;

        function playSound(id) {
            const buttons = document.querySelectorAll('.cosmic-btn');
            const clickedBtn = buttons[id - 1];
            const targetAudio = document.getElementById(`audio-${id}`);

            // If the same button is tapped while playing, stop it
            if (currentAudio === targetAudio) {
                targetAudio.pause();
                targetAudio.currentTime = 0;
                clickedBtn.classList.remove('playing');
                currentAudio = null;
                currentBtn = null;
                return;
            }

            // Stop any currently playing audio track
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentBtn) currentBtn.classList.remove('playing');
            }

            // Play the new audio track
            targetAudio.play().catch(e => console.log("Audio file missing? Expecting sound" + id + ".mp3 in this folder."));
            clickedBtn.classList.add('playing');
            
            currentAudio = targetAudio;
            currentBtn = clickedBtn;

            // Clean up when track naturally finishes
            targetAudio.onended = function() {
                clickedBtn.classList.remove('playing');
                if (currentAudio === targetAudio) {
                    currentAudio = null;
                    currentBtn = null;
                }
            };
        }
    </script>
</body>
</html>
